<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Story Not Found | StoryFirst PH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=League+Spartan:wght@400;700&family=Montserrat:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      .font-anton {
        font-family: "Anton", sans-serif;
      }
      .font-spartan {
        font-family: "League Spartan", sans-serif;
      }
      .font-montserrat {
        font-family: "Montserrat", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-neutral-950 text-white h-screen flex flex-col items-center justify-center p-6 text-center"
  >
    <div class="max-w-2xl">
      <span
        class="bg-yellow-500 text-black uppercase font-spartan font-bold px-3 py-1 text-[10px] tracking-widest inline-block mb-6 shadow-sm"
      >
        Error 404
      </span>
      <h1
        class="text-6xl sm:text-8xl font-anton font-normal uppercase tracking-wide leading-[1.1] mb-6"
      >
        Story <span class="text-yellow-500">Not Found.</span>
      </h1>
      <p class="text-neutral-400 font-montserrat font-light text-lg mb-10">
        The page or project you are looking for has been moved, deleted, or
        never existed in the first place.
      </p>
      <a
        href="/storyfirst-ph/"
        class="inline-flex items-center justify-center bg-yellow-500 text-black px-10 py-4 font-spartan font-bold uppercase tracking-widest text-sm hover:bg-yellow-400 transition-colors shadow-xl shadow-yellow-500/20"
      >
        Return to Main Sequence
      </a>
    </div>
  </body>
</html>
